<style>
/* ============================================================
   SOMIN — somin-brand-guideline (2026, Brands voice)
   teal #2DBF9C · ink #16201F · white · teal-tinted greys · Montserrat
   Wordmark: "SO" teal + "MIN" ink/white, joined, tight, top-left.

   SIMPLICITY RULES THIS FILE OBEYS
   1. Five nav items. Never more.
   2. One primary action per screen. Everything else is a quiet link.
   3. Nothing starts blank — every setting arrives pre-filled and explained.
   4. Jargon lives behind "why", never in a label.
   5. Evidence is reachable from the result, not browsed up front.
   ============================================================ */
:root{
  --teal:#2DBF9C; --teal-d:#1F8A70; --teal-l:#55D0B3; --teal-t:#D5F2EA; --teal-t2:#A7E5D5;
  --deep:#14655A;
  --ink:#16201F; --ink-2:#1F2A29; --ink-3:#0F1817;
  --body:#2A3635; --soft:#6B7A78; --faint:#9BA8A6;
  --hair:#DFEAE8; --hair-2:#C9D1D0;
  --page:#FFFFFF; --wash:#F2FAF8;
  --r:14px; --r-s:10px;
  --font:'Montserrat','Noto Sans SC',system-ui,-apple-system,sans-serif;
  --shadow:0 1px 2px rgba(22,32,31,.05),0 10px 30px rgba(22,32,31,.07);
  --shadow-lg:0 24px 70px rgba(22,32,31,.18);
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--page);color:var(--body);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
input,select,textarea{font:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--hair-2);border-radius:20px;border:3px solid #fff}
::-webkit-scrollbar-track{background:transparent}
h1,h2,h3{line-height:1.14;letter-spacing:-.02em;color:var(--ink)}

/* ---------- wordmark ---------- */
.wmk{display:inline-flex;font-weight:800;letter-spacing:normal;font-size:21px;line-height:1;user-select:none}
.wmk .so{color:var(--teal)}
.wmk .min{color:#fff}
.on-light .min{color:var(--ink)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px 1fr;height:100vh;overflow:hidden}
.side{background:var(--ink);color:#C9D1D0;display:flex;flex-direction:column;padding:22px 14px 16px}
.side .brand{padding:0 10px 26px;display:flex;align-items:center;gap:10px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;white-space:nowrap;
  padding:11px 12px;border-radius:var(--r-s);color:#C9D1D0;font-weight:600;font-size:14.5px;transition:.14s;position:relative}
.nav button .ic{width:18px;flex:none;text-align:center;font-size:15px;opacity:.85}
.nav button:hover{background:var(--ink-2);color:#fff}
.nav button.on{background:var(--ink-2);color:#fff}
.nav button.on::before{content:"";position:absolute;left:-14px;top:10px;bottom:10px;width:3px;background:var(--teal);border-radius:0 3px 3px 0}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--teal);color:var(--ink);padding:1px 8px;border-radius:999px}
.nav .cnt.q{background:var(--ink-3);color:var(--faint)}
.side .foot{margin-top:auto;padding:16px 12px 0;border-top:1px solid var(--ink-2);font-size:12px;color:var(--faint)}
.side .foot b{display:block;color:#fff;font-size:13px;font-weight:700}
.side .foot #whoPlan{display:block;margin-top:2px}
.side .foot a{display:inline-block;margin-top:8px;color:var(--teal);font-weight:700;font-size:12.5px}

.main{display:flex;flex-direction:column;overflow:hidden;background:var(--page)}
.top{height:64px;flex:none;display:flex;align-items:center;gap:14px;padding:0 30px;border-bottom:1px solid var(--hair)}
.top h2{font-size:17px;font-weight:800}
.top .sp{flex:1}
.ws{display:flex;align-items:center;gap:9px;padding:6px 12px;border:1px solid var(--hair);border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;transition:.14s}
.ws:hover{border-color:var(--hair-2);background:var(--wash)}
.ws .av{width:22px;height:22px;border-radius:6px;background:var(--ink);color:var(--teal);display:grid;place-items:center;font-size:11px;font-weight:800}
.lang{display:inline-flex;border:1px solid var(--hair);border-radius:999px;overflow:hidden}
.lang button{padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--soft)}
.lang button.on{background:var(--ink);color:#fff}
.scroll{flex:1;overflow-y:auto}
.wrap{max-width:1080px;margin:0 auto;padding:38px 30px 90px}
.wrap.chatwrap{max-width:100%;padding:0;height:100%}

/* ---------- type ---------- */
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--teal);margin-bottom:12px}
.h1{font-size:34px;font-weight:800;letter-spacing:-.03em}
.h2{font-size:21px;font-weight:800}
.lede{font-size:16px;color:var(--soft);margin-top:10px;max-width:62ch;line-height:1.6}
.muted{color:var(--soft)}
.tiny{font-size:12.5px;color:var(--faint)}
.sec{margin-top:44px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.sec-h h3{font-size:15px;font-weight:800;letter-spacing:-.01em}
.sec-h .n{font-size:13px;color:var(--faint);font-weight:600}
.sec-h .lnk{margin-left:auto;font-size:13px;font-weight:700;color:var(--teal-d)}
.sec-h .lnk:hover{text-decoration:underline}

/* ---------- buttons ---------- */
.btn{background:var(--teal);color:var(--ink);font-weight:700;font-size:14.5px;padding:12px 22px;
  border-radius:999px;display:inline-flex;align-items:center;gap:9px;transition:.14s;white-space:nowrap}
.btn:hover{background:var(--teal-l)}
.btn:active{background:var(--teal-d);color:#fff}
.btn.big{font-size:15.5px;padding:15px 30px}
.btn.ghost{background:transparent;border:1.5px solid var(--hair-2);color:var(--ink)}
.btn.ghost:hover{border-color:var(--ink);background:var(--wash)}
.btn.dark{background:var(--ink);color:#fff}
.btn.dark:hover{background:var(--ink-2)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sm{font-size:13px;padding:8px 16px}
.lnkbtn{font-size:13.5px;font-weight:700;color:var(--teal-d)}
.lnkbtn:hover{text-decoration:underline}

/* ---------- playbook card ---------- */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:1000px){.cards{grid-template-columns:1fr 1fr}}
.pb{border:1px solid var(--hair);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;
  background:#fff;transition:.16s;cursor:pointer;position:relative;text-align:left}
.pb:hover{border-color:var(--teal);box-shadow:var(--shadow);transform:translateY(-2px)}
.pb .ico{width:40px;height:40px;border-radius:11px;background:var(--teal-t);color:var(--deep);
  display:grid;place-items:center;font-size:18px;margin-bottom:15px}
.pb h4{font-size:16.5px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.pb .q{font-size:13.5px;color:var(--soft);margin-top:7px;line-height:1.5;flex:1}
.pb .foot{margin-top:16px;padding-top:13px;border-top:1px solid var(--hair);
  display:flex;align-items:flex-end;gap:10px;font-size:12px;color:var(--faint);font-weight:600;line-height:1.4}
.pb .go{margin-left:auto;color:var(--teal-d);font-weight:700;font-size:13px;white-space:nowrap}
.pb .go:hover{text-decoration:underline}
.pb .flag{position:absolute;top:16px;right:16px;font-size:10px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--teal-t);color:var(--deep)}
.pb .flag.buy{background:var(--ink);color:#fff}
.pb .flag.shared{background:var(--wash);color:var(--soft);border:1px solid var(--hair)}

/* ---------- plays strip ---------- */
.plays{display:flex;gap:9px;flex-wrap:wrap}
.play{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--hair);border-radius:999px;
  padding:9px 16px 9px 12px;font-size:13.5px;font-weight:600;color:var(--ink);transition:.14s;background:#fff}
.play:hover{border-color:var(--teal);background:var(--wash)}
.play .d{width:7px;height:7px;border-radius:2px;background:var(--teal);flex:none}
.play small{color:var(--faint);font-weight:500;font-size:12px}

/* ---------- run rows ---------- */
.row{display:flex;align-items:center;gap:16px;border:1px solid var(--hair);border-radius:var(--r);
  padding:16px 20px;margin-bottom:10px;background:#fff;transition:.14s;cursor:pointer;text-align:left;width:100%}
.row:hover{border-color:var(--hair-2);box-shadow:var(--shadow)}
.row .rico{width:36px;height:36px;border-radius:10px;background:var(--wash);display:grid;place-items:center;flex:none;font-size:16px}
.row b{font-size:14.5px;color:var(--ink);display:block}
.row .rm{font-size:12.5px;color:var(--soft);margin-top:2px}
.row .go{font-size:12.5px;font-weight:700;color:var(--teal-d);margin-left:auto;white-space:nowrap}
.row .go:hover{text-decoration:underline}
.row .st{margin-left:14px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  padding:5px 12px;border-radius:999px;white-space:nowrap;flex:none}
.st.done{background:var(--teal-t);color:var(--deep)}
.st.run{background:var(--ink);color:#fff}
.st.hold{background:var(--wash);color:var(--soft);border:1px solid var(--hair)}
.bar{height:4px;background:var(--hair);border-radius:99px;overflow:hidden;margin-top:9px;max-width:280px}
.bar i{display:block;height:100%;background:var(--teal);transition:width .6s cubic-bezier(.2,.7,.2,1)}

/* ---------- setup (step 1) ---------- */
.steps{display:flex;align-items:center;gap:10px;margin-bottom:30px;font-size:12.5px;font-weight:700}
.steps .s{display:flex;align-items:center;gap:8px;color:var(--faint)}
.steps .s .n{width:22px;height:22px;border-radius:50%;background:var(--hair);color:var(--soft);
  display:grid;place-items:center;font-size:11.5px;font-weight:800}
.steps .s.on{color:var(--ink)}
.steps .s.on .n{background:var(--teal);color:var(--ink)}
.steps .s.done .n{background:var(--teal-d);color:#fff}
.steps .sep{width:26px;height:1px;background:var(--hair)}

.set{border:1px solid var(--hair);border-radius:var(--r);overflow:hidden;background:#fff}
.set .r{display:flex;align-items:flex-start;gap:20px;padding:20px 22px;border-bottom:1px solid var(--hair)}
.set .r:last-child{border-bottom:0}
.set .k{width:210px;flex:none;font-size:13.5px;font-weight:700;color:var(--ink);padding-top:2px}
.set .k small{display:block;font-weight:500;color:var(--faint);font-size:12px;margin-top:3px;line-height:1.45}
.set .v{flex:1}
.set .v .cur{font-size:14.5px;font-weight:600;color:var(--ink)}
.set .v .why{font-size:12.5px;color:var(--soft);margin-top:5px;line-height:1.55;max-width:60ch}
.set .ch{margin-left:auto;flex:none}
.set select{border:1px solid var(--hair);border-radius:var(--r-s);padding:9px 12px;font-size:13.5px;
  font-weight:600;color:var(--ink);background:#fff;max-width:100%;outline:none;margin-top:2px}
.set select:focus{border-color:var(--teal)}
.freewrap{display:flex;gap:9px;align-items:center;margin-top:9px;max-width:560px}
.freewrap[hidden]{display:none}
.set .free{margin-top:0;flex:1}
.freebtn{flex:none;background:var(--teal);color:var(--ink);font-weight:700;font-size:13px;
  padding:10px 16px;border-radius:999px;white-space:nowrap;transition:.14s;animation:pop .18s}
.freebtn:hover{background:var(--teal-l)}
.freebtn[hidden]{display:none}
/* ---------- step list ---------- */
.set .r.step{align-items:flex-start}
.set .r.step.off{opacity:.5}
.stepn{width:26px;height:26px;border-radius:8px;background:var(--wash);border:1px solid var(--hair);
  display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--soft)}
.r.step .picked{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:13px;font-weight:600;color:var(--deep)}
.r.step .picked .d{width:7px;height:7px;border-radius:2px;background:var(--teal);flex:none}
.skipflag{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  background:var(--wash);border:1px solid var(--hair);color:var(--soft);padding:3px 9px;border-radius:999px}

/* ---------- option list (Claude-style pick-one) ---------- */
.opts{display:flex;flex-direction:column;gap:8px;margin-top:9px}
.opt{display:flex;align-items:flex-start;gap:11px;text-align:left;width:100%;
  border:1px solid var(--hair);border-radius:var(--r-s);padding:13px 15px;font-size:14px;
  color:var(--ink);background:#fff;transition:.13s;font-weight:600}
.opt:hover{border-color:var(--teal);background:var(--wash)}
.opt.on{border-color:var(--teal);background:var(--wash)}
.opt .rd{width:15px;height:15px;border-radius:50%;border:2px solid var(--hair-2);flex:none;margin-top:2px;transition:.13s}
.opt.on .rd{border-color:var(--teal);border-width:5px}

/* ---------- step chat ---------- */
.chat{border:1px solid var(--hair);border-radius:var(--r-s);background:var(--wash);
  padding:14px;margin-top:9px;max-height:210px;overflow-y:auto;display:flex;flex-direction:column;gap:9px}
.chatempty{font-size:13px;color:var(--faint);line-height:1.55}
.chat .msg{max-width:86%;padding:10px 13px;border-radius:12px;font-size:13.5px;line-height:1.55}
.chat .msg.you{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:4px}
.chat .msg.bot{align-self:flex-start;background:#fff;border:1px solid var(--hair);border-bottom-left-radius:4px}
.chat .prop{display:inline-block;margin-top:7px;font-weight:700;color:var(--deep)}
.applybtn{display:block;margin-top:10px;font-size:12.5px;font-weight:700;color:var(--ink);
  background:var(--teal);border-radius:999px;padding:6px 13px}
.applybtn:hover{background:var(--teal-l)}
.chatin{display:flex;gap:9px;margin-top:10px}
.chatin .inp{margin-top:0;flex:1}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}

.note{background:var(--wash);border:1px solid var(--hair);border-radius:var(--r);padding:16px 20px;
  font-size:13.5px;color:var(--soft);line-height:1.6;margin-top:18px;display:flex;gap:12px}
.note .d{width:8px;height:8px;border-radius:2px;background:var(--teal);flex:none;margin-top:7px}
.actions{display:flex;align-items:center;gap:14px;margin-top:28px}

/* ---------- build (step 2) ---------- */
.build{border:1px solid var(--hair);border-radius:var(--r);background:#fff;overflow:hidden}
.build .bh{padding:22px 24px;border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:14px}
.pl{display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--hair);
  font-size:14px;opacity:.4;transition:.35s}
.pl:last-child{border-bottom:0}
.pl.on,.pl.ok{opacity:1}
.pl.ok{cursor:pointer}
.pl.ok:hover{background:var(--wash)}
.pl.ok .out::after{content:" ›";color:var(--teal-d);font-weight:800}
.pl .m{width:20px;height:20px;border-radius:6px;background:var(--hair);display:grid;place-items:center;
  flex:none;font-size:11px;color:var(--soft);font-weight:800}
.pl.on .m{background:var(--ink);color:#fff}
.pl.ok .m{background:var(--teal);color:var(--ink)}
.pl b{font-weight:700;color:var(--ink)}
.pl .out{margin-left:auto;font-size:12.5px;color:var(--soft);font-weight:600}
.spin{width:12px;height:12px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- result (step 3) ---------- */
.deliv{border:1px solid var(--teal);border-radius:var(--r);background:var(--wash);padding:26px;display:flex;gap:24px;align-items:center}
.deliv .thumb{width:132px;height:86px;border-radius:9px;background:var(--ink);flex:none;position:relative;overflow:hidden}
.deliv .thumb .t1{position:absolute;left:12px;top:16px;width:60%;height:7px;background:var(--teal);border-radius:2px}
.deliv .thumb .t2{position:absolute;left:12px;top:31px;width:78%;height:5px;background:#3E4E4C;border-radius:2px}
.deliv .thumb .t3{position:absolute;left:12px;top:42px;width:44%;height:5px;background:#3E4E4C;border-radius:2px}
.deliv .thumb .t4{position:absolute;left:12px;bottom:12px;width:30%;height:16px;background:#2A3635;border-radius:3px}
.deliv h3{font-size:19px;font-weight:800}
.ev{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.evc{border:1px solid var(--hair);border-radius:var(--r-s);padding:16px 18px;background:#fff;text-align:left;transition:.14s}
.evc:hover{border-color:var(--teal);box-shadow:var(--shadow)}
.evc .n{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.evc .l{font-size:11px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--teal);margin:7px 0 4px}
.evc .d{font-size:12.5px;color:var(--soft);line-height:1.5}
.evc .go{font-size:12.5px;font-weight:700;color:var(--teal-d);margin-top:10px;display:block}

/* ---------- store ---------- */
.tabs{display:inline-flex;background:var(--wash);border:1px solid var(--hair);border-radius:999px;padding:4px;margin-bottom:26px}
.tabs button{padding:8px 18px;border-radius:999px;font-size:13.5px;font-weight:700;color:var(--soft)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(22,32,31,.08)}
.price{font-size:13px;font-weight:800;color:var(--ink)}
.price small{font-weight:600;color:var(--faint)}

/* ---------- modal ---------- */
.ovl{position:fixed;inset:0;background:rgba(15,24,23,.5);z-index:200;display:flex;align-items:center;
  justify-content:center;padding:30px;overflow-y:auto}
.mod{width:min(620px,100%);background:#fff;border-radius:18px;box-shadow:var(--shadow-lg);
  overflow:hidden;margin:auto;animation:pop .22s cubic-bezier(.2,.7,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.99)}to{opacity:1;transform:none}}
.mod .mh{padding:26px 28px 20px;border-bottom:1px solid var(--hair);position:relative}
.mod .mb{padding:24px 28px}
.mod .mf{padding:18px 28px 24px;display:flex;align-items:center;gap:12px}
.mod .x{position:absolute;top:20px;right:22px;width:30px;height:30px;border-radius:8px;
  display:grid;place-items:center;color:var(--soft);font-size:17px}
.mod .x:hover{background:var(--wash);color:var(--ink)}
.kv{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--hair);font-size:13.5px}
.kv:last-child{border-bottom:0}
.src{font-size:12px;color:var(--faint);margin-top:8px;font-family:ui-monospace,Menlo,monospace}
.evhead{display:flex;gap:14px;padding:0 0 9px;font-size:11px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--hair)}
.evrow{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--hair);font-size:13.5px}
.evrow:last-child{border-bottom:0}
.evrow.off{opacity:.38}
.evrow.off .c1{text-decoration:line-through}
.evhead .cx,.evrow .cx{width:30px;flex:none}
.tick{width:19px;height:19px;border-radius:5px;border:1.5px solid var(--hair-2);background:#fff;

<script>
/* =====================================================================
   SOMIN Playbooks — a deliberately small app.

   VOCABULARY (borrowed from tools marketers already use)
     Playbook — a repeatable multi-step motion that ends in a deliverable.
                HubSpot uses "playbook" the same way. Maps 1:1 to a
                /somin-*-deck skill.
     Play     — one step, runnable on its own (/whitespace-analysis).
                A Playbook is an ordered list of Plays.
     Run      — one execution of a Playbook. Lives in "My work".
     Store    — where you get more Playbooks. Modelled on Semrush's
                App Center: install, buy, or accept one shared with you.

   There is no "advanced mode". There is one app.
   ===================================================================== */

const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

/* ---------------- auth: SHA-256 of "<email>|<password>" ---------------- */
const AUTH_H = [
  "e88d7252048b25731e189fc3a620fce997da68c92abd64c2f123ba50e11fec4c", /* kirill@somin.ai */
  "1e8bed5d0f724ae7966e3d7c689cd6929e33be0acc4a2d7e2c40bf6c8a983640"  /* sasha@somin.ai  */
];
async function sha256Hex(str){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function doLogin(){
  const u=($('#lu').value||'').trim().toLowerCase(), p=($('#lp').value||'').trim();
  if(!u||!p){ $('#lerr').textContent = t('Enter your email and password.'); return; }
  let ok=false; try{ ok = AUTH_H.indexOf(await sha256Hex(u+'|'+p)) !== -1; }catch(e){ ok=false; }
  if(!ok){ $('#lerr').textContent = t('Incorrect email or password.'); return; }
  try{ localStorage.setItem('somin_auth','1'); }catch(e){}
  $('#whoName').textContent = u.split('@')[0].replace(/^./,c=>c.toUpperCase());
  $('#login').style.display='none';
}
function doLogout(){ try{ localStorage.removeItem('somin_auth'); }catch(e){}
  $('#login').style.display='grid'; $('#lu').value=''; $('#lp').value=''; $('#lerr').textContent=''; }
try{ if(localStorage.getItem('somin_auth')==='1'){ document.getElementById('login').style.display='none'; } }catch(e){}

/* ---------------- language (English default) ---------------- */
let LANG='en';
try{ LANG = localStorage.getItem('somin_lang') || 'en'; }catch(e){}
const ZH = {
  'Make something':'开始制作','My work':'我的工作','Playbook Store':'剧本商店',

  'Your playbooks':'你的剧本','Run one play on its own':'单独运行一个剧目',
  'Pick up where you left off':'继续上次的工作','See all →':'查看全部 →',
  'Get more playbooks →':'获取更多剧本 →','Check the setup':'确认设置',
  'Building':'生成中','Done':'完成','Build it →':'开始生成 →',
  'Enter your email and password.':'请输入邮箱和密码。','Incorrect email or password.':'邮箱或密码不正确。',
  'Installed':'已安装','Available':'可获取','Shared with you':'共享给你',
  'Install':'安装','Installed ✓':'已安装 ✓','Accept':'接受','Buy':'购买',
  'Share…':'共享…','Change':'更改','Cancel':'取消','Close':'关闭'
};
function t(s){ return (LANG==='zh' && ZH[s]) ? ZH[s] : s; }
function setLang(l){
  LANG=l; try{ localStorage.setItem('somin_lang',l); }catch(e){}
  $('#lgEn').classList.toggle('on', l==='en'); $('#lgZh').classList.toggle('on', l==='zh');
  document.documentElement.lang = l;
  $$('[data-t]').forEach(el=>{
    if(!el.dataset.en) el.dataset.en = el.textContent;
    el.textContent = t(el.dataset.en);
  });
  render();
}

  if(c.free && c.free.trim()) return c.free.trim();
  return TUNE[k] ? TUNE[k].opts[c.i] : '';
}

function stepList(p){
  return `<div class="set" style="margin-top:14px">
    ${p.plays.map((k,i)=>{
      const c = cfg(k);
      return `<div class="r step ${c.skip?'off':''}">
        <div class="k" style="width:52px;flex:none">
          <span class="stepn">${i+1}</span>
        </div>
        <div class="v">
          <div class="cur">${esc(PLAYS[k].n)}</div>
          <div class="why">${esc(TUNE[k]?TUNE[k].do:'')}</div>
          <div class="picked">${c.skip?`<span class="skipflag">${t('Skipped')}</span>`:`<span class="d"></span>${esc(cfgLabel(k))}`}</div>
        </div>
        <div class="ch" style="display:flex;gap:10px;align-items:center">
          <button class="btn ghost sm" onclick="tuneStep('${k}')">${t('Adjust')}</button>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

/* ---- the step panel: options, free text, skip, and a chat ---- */
function tuneStep(k){
  const c = cfg(k), tn = TUNE[k];
  $('#modal').innerHTML = `<div class="ovl" onclick="if(event.target===this)closeMod()"><div class="mod" style="width:min(680px,100%)">
    <div class="mh">
      <div class="eyebrow" style="margin-bottom:8px">${t('STEP')} · ${esc(PLAYS[k].cmd)}</div>
      <h2 style="font-size:20px">${esc(PLAYS[k].n)}</h2>
      <div class="muted" style="font-size:13.5px;margin-top:6px">${esc(tn.do)}</div>
      <button class="x" onclick="closeMod()">✕</button>
    </div>
    <div class="mb" id="tuneBody">${tuneOpts(k)}</div>
    <div class="mf">
      <button class="btn" onclick="applyStep('${k}')">${t('Save this step')}</button>
      <button class="lnkbtn" onclick="closeMod()">${t('Cancel')}</button>
      <button class="lnkbtn" style="margin-left:auto;color:var(--soft)" onclick="toggleSkip('${k}')">
        ${c.skip?t('Put this step back'):t('Skip this step')}</button>
    </div>
  </div></div>`;
}

function tuneOpts(k){
  const c = cfg(k), tn = TUNE[k];
  return `
  ${c.skip?`<div class="note" style="margin:0 0 18px"><span class="d"></span><span>
    <b>${t('This step is skipped.')}</b> ${t('The playbook will run without it — anything downstream that needed it falls back to what is already in the workspace.')}
  </span></div>`:''}
  <span class="lbl">${t('How should this step run?')}</span>
  <div class="opts">
    ${tn.opts.map((o,i)=>`<button class="opt ${(!c.free && c.i===i)?'on':''}" onclick="pickOpt('${k}',${i})">
      <span class="rd"></span><span>${esc(o)}</span></button>`).join('')}
    <button class="opt ${c.free?'on':''}" onclick="pickOpt('${k}',-1)">
      <span class="rd"></span><span>${t('Something else — I will write it')}</span></button>
  </div>
  <input class="inp" id="tuneFree" ${c.free?'':'hidden'} value="${esc(c.free||'')}"
    placeholder="${t('e.g. only the Singapore market, and treat caregivers as the primary buyer')}"
    oninput="cfg('${k}').free=this.value">
  <button class="chatopen" onclick="closeMod();copOpen('${k}');copSend('${esc(PLAYS[k].n)}')">
    <span class="copav sm">◆</span>
    <span><b>${t('None of these fit?')}</b><small>${t('Open the Copilot and describe what you want — it can change this step, or the whole run.')}</small></span>
    <span class="go">→</span>
  </button>`;
}

function pickOpt(k,i){
  const c = cfg(k);
  if(i===-1){ c.free = c.free || ' '; }
  else { c.i = i; c.free = ''; }
  const b = document.getElementById('tuneBody'); if(b) b.innerHTML = tuneOpts(k);
  const f = document.getElementById('tuneFree');
  if(f && i===-1){ f.hidden=false; f.value = c.free.trim(); f.focus(); }
}
function toggleSkip(k){ const c=cfg(k); c.skip=!c.skip; closeMod(); render(); 
  toast(c.skip? t('Step skipped.') : t('Step is back in.')); }
function applyStep(k){
  const f = document.getElementById('tuneFree');
  if(f && !f.hidden) cfg(k).free = f.value;
  closeMod(); render(); toast(PLAYS[k].n + ' — ' + t('updated.'));
}

/* ---- the chat: proposes a concrete change you can apply in one click ---- */
function chatHTML(k){
  const c = cfg(k);
  if(!c.chat.length) return `<div class="chatempty">${t('Describe what you want differently and I will turn it into a setting for this step.')}</div>`;
  return c.chat.map(m=>m.who==='you'
    ? `<div class="msg you">${esc(m.text)}</div>`
    : `<div class="msg bot">${m.text}${m.apply?`<button class="applybtn" onclick="applyProposal('${k}','${esc(m.apply).replace(/'/g,"\\'")}')">${t('Use this')}</button>`:''}</div>`
  ).join('');
}

/* A small rule-based stand-in for the real assistant — it reads the request,
   proposes one concrete setting, and offers to apply it. */
function replyTo(k, msg){
  const m = msg.toLowerCase();
  const rules = [
    [/singapore|sg\b|market|country|region/, 'Narrow this step to a single market.',
     'Singapore only — ignore other markets'],
    [/caregiver|carer/, 'Treat caregivers as their own audience rather than folding them into rehab patients.',
     'Caregivers as a separate primary audience'],
    [/fast|quick|hurry|speed|rush/, 'Run the lighter version — fewer windows, no backfill.',
     'Fast pass — 90 days, no prior-year check'],
    [/skip|drop|remove|without/, 'Leave this step out entirely and let the next one use what is already in the workspace.',
     null, 'skip'],
    [/paid|ad|ads/, 'Exclude paid placements so this reads organic behaviour only.',
     'Organic content only — exclude paid'],
    [/compet|rival|brand/, 'Change the comparison set for this step only.',
     'Compare against Wandercraft and Cionic only'],
    [/short|fewer|less|smaller/, 'Cut the volume so the output stays tight.',
     'Half the usual volume — the strongest items only'],
    [/more|deeper|expand|longer/, 'Go wider — more items, more history.',
     'Expanded — more items and a longer window'],
    [/tone|voice|style|sound/, 'Shift the register of what this step writes.',
     'Practitioner voice — plain, clinical, no hype'],
    [/why|how|explain|what does/, null, null, 'explain']
  ];
  for(const [re, said, apply, mode] of rules){
    if(re.test(m)){
      if(mode==='explain') return {text:`<b>${esc(PLAYS[k].n)}</b> — ${esc(TUNE[k].do)} ${t('It runs')} <span class="mono">${esc(PLAYS[k].cmd)}</span> ${t('and typically returns')} ${esc(PLAYS[k].out)}. ${t('Tell me what you want changed and I will set it.')}`};
      if(mode==='skip') return {text:t('Understood — I can leave this step out.')+' '+t('Use the skip control below and the playbook runs without it.')};
      return {text:esc(said)+'<br><span class="prop">“'+esc(apply)+'”</span>', apply:apply};
    }
  }
  return {text:t('I can set this step to whatever you need — try naming a market, an audience, a competitor set, a tone, or say “faster” or “deeper”.')};
}

function sendChat(k){
  const input = document.getElementById('chatMsg');
  const txt = (input.value||'').trim(); if(!txt) return;
  const c = cfg(k);
  c.chat.push({who:'you', text:txt});
  c.chat.push(Object.assign({who:'bot'}, replyTo(k, txt)));
  input.value='';
  const b = document.getElementById('tuneBody'); if(b) b.innerHTML = tuneOpts(k);
  const ch = document.getElementById('tuneChat'); if(ch) ch.scrollTop = ch.scrollHeight;
  const i2 = document.getElementById('chatMsg'); if(i2) i2.focus();
}
function applyProposal(k, text){
  const c = cfg(k); c.free = text;
  const b = document.getElementById('tuneBody'); if(b) b.innerHTML = tuneOpts(k);
  toast(t('Set. Save the step to keep it.'));
}

/* =====================================================================
   COPILOT — a real chat panel, not a one-line box.

   It can see the whole scope of the run (the four settings AND every step)
   and can change any of it. Every change arrives as a reviewable card with
   an Apply button and an Undo, so the conversation never silently mutates
   the plan behind your back — you approve each edit, and the setup screen
   updates live underneath.
   ===================================================================== */
let COP = {open:false, step:null, msgs:[], n:0};

function copOpen(step){
  COP.open = true; COP.step = step || null;
  if(!COP.msgs.length) copGreet();
  paintCop();
}
function copClose(){ COP.open=false; paintCop(); }

function copGreet(){
  const p = RUN ? byId(RUN) : null;
  COP.msgs.push({who:'bot', text: p
    ? `${t('I can see everything about this run')} — <b>${esc(p.name)}</b>, ${t('its four settings and all')} ${p.plays.length} ${t('steps')}. ${t('Tell me what you want different and I will propose the change for you to approve.')}`
    : t('Tell me what you want to make and I will set it up.')});
}

/* ---------- what the copilot currently knows ---------- */
function scopeSummary(){
  const p = byId(RUN); if(!p) return '';
  const setRows = Object.keys(SETUP).map(k=>{
    const cur = SETVALS[k] || {i:0, free:''};
    const v = cur.free && cur.free.trim() ? cur.free.trim() : SETUP[k].opts[cur.i].v;
    return `<div class="scrow"><span class="sk">${t(SETUP[k].k)}</span><span class="sv">${esc(v)}</span></div>`;
  }).join('');
  const stepRows = p.plays.map((k,i)=>{
    const c = cfg(k);
    return `<div class="scrow ${c.skip?'off':''}"><span class="sk">${i+1}. ${esc(PLAYS[k].n)}</span>
      <span class="sv">${c.skip?t('Skipped'):esc(cfgLabel(k))}</span></div>`;
  }).join('');
  return `<div class="scopecard">
    <div class="scoph">${t('What I can change')}</div>
    ${setRows}<div class="scsep"></div>${stepRows}
  </div>`;
}

/* ---------- the rule engine: request in, change cards out ---------- */
function findStep(msg){
  const p = byId(RUN); if(!p) return null;
  const m = msg.toLowerCase();
  for(const k of p.plays){
    const n = PLAYS[k].n.toLowerCase();
    if(m.includes(n)) return k;
    const words = n.split(' ').filter(w=>w.length>4);
    if(words.some(w=>m.includes(w))) return k;
  }
  if(/persona|audience|who/.test(m) && p.plays.includes('personas')) return 'personas';
  if(/trend|moving|rising/.test(m) && p.plays.includes('trends')) return 'trends';
  if(/whitespace|gap|open/.test(m) && p.plays.includes('whitespace')) return 'whitespace';
  if(/idea|insight|story/.test(m) && p.plays.includes('insights')) return 'insights';
  if(/offer|proposition/.test(m) && p.plays.includes('props')) return 'props';
  if(/moment|timing|when/.test(m) && p.plays.includes('moments')) return 'moments';
  if(/calendar|schedule|cadence|weeks/.test(m) && p.plays.includes('calendar')) return 'calendar';
  if(/brief|post|copy/.test(m) && p.plays.includes('briefs')) return 'briefs';
  if(/creative|render|visual|image/.test(m) && p.plays.includes('creative')) return 'creative';
  if(/scor|click/.test(m) && p.plays.includes('scoring')) return 'scoring';
  if(/qa|check|quality/.test(m) && p.plays.includes('qa')) return 'qa';
  return null;
}

function card(label, desc, apply){ return {id:'c'+(++COP.n), label:label, desc:desc, apply:apply, done:false}; }

function copThink(msg){
  const m = msg.toLowerCase(), p = byId(RUN);
  const step = findStep(msg);
  const cards = [];
  let text = '';

  /* --- show me the plan --- */
  if(/plan|scope|summar|what.*set|show me|recap|current/.test(m)){
    return {text: t('Here is the whole scope as it stands. Anything in it can be changed — just say what you want.'), scope:true};
  }
  /* --- explain --- */
  if(/^(why|what does|what is|how does|explain)/.test(m)){
    if(step) return {text:`<b>${esc(PLAYS[step].n)}</b> — ${esc(TUNE[step].do)}<br><br>${t('It runs')} <span class="mono">${esc(PLAYS[step].cmd)}</span> ${t('and usually returns')} <b>${esc(PLAYS[step].out)}</b>. ${t('Right now it is set to')} “${esc(cfgLabel(step))}”.`};
    return {text: t('This playbook runs') + ` <b>${p.plays.length} ${t('steps')}</b> — ` +
      p.plays.map(k=>esc(PLAYS[k].n.toLowerCase())).join(' → ') + '. ' +
      t('Ask me about any one of them, or tell me what to change.')};
  }
  /* --- geography --- */
  const geo = m.match(/\b(singapore|malaysia|indonesia|uk|us|usa|america|japan|korea|australia|china|india|thailand|vietnam|germany|france)\b/);
  if(geo){
    const place = geo[1].replace(/^\w/,c=>c.toUpperCase());
    text = t('I can scope this run to one market. That changes the cultural anchor dates in the calendar and narrows every panel.');
    cards.push(card(t('Scope the whole run to')+' '+place,
      t('Applies to all steps, and the calendar anchors to that market\'s dates.'),
      {type:'global', value: place + ' only'}));
    if(step) cards.push(card(t('Only this step')+': '+PLAYS[step].n,
      t('Leaves the rest of the run global.'), {type:'step', key:step, value: place+' only — ignore other markets'}));
    return {text:text, cards:cards};
  }
  /* --- audience --- */
  if(/caregiver|carer/.test(m)){
    text = t('Caregivers are in the data but currently folded in with rehab patients — 43 posts of their own. I can split them out.');
    cards.push(card(t('Add caregivers as their own audience'),
      t('Changes the persona step and the audience panel together.'),
      {type:'multi', items:[{type:'step', key:'personas', value:'Caregivers as a separate primary audience'},
                            {type:'setting', key:'audience', free:'Caregivers of adults over 70 — split from rehab patients'}]}));
    return {text:text, cards:cards};
  }
  if(/audience|panel|creators|room/.test(m) && !step){
    text = t('The audience panel is what everything downstream reads. Three are already built, or describe one and I will assemble it.');
    SETUP.audience.opts.slice(0,3).forEach((o,i)=>cards.push(card(o.v, o.why.slice(0,90)+'…', {type:'setting', key:'audience', i:i})));
    return {text:text, cards:cards};
  }
  /* --- competitors --- */
  if(/compet|rival|versus|vs\b|benchmark against/.test(m)){
    text = t('The comparison set drives the whitespace read — fewer rivals makes more themes look open, so this one matters.');
    SETUP.rivals.opts.slice(0,3).forEach((o,i)=>cards.push(card(o.v, o.why.slice(0,90)+'…', {type:'setting', key:'rivals', i:i})));
    return {text:text, cards:cards};
  }
  /* --- speed / window --- */
  if(/fast|quick|hurry|speed|rush|today|asap/.test(m)){
    text = t('I can cut this down, but you lose the prior-year check — nothing from a fast pass should be shown to a client as a trend.');
    cards.push(card(t('Fast pass — 90 days, unverified'), t('Roughly three times quicker. Trend claims get labelled unverified.'),
      {type:'setting', key:'window', i:2}));
    cards.push(card(t('Keep the check, halve the history'), t('6 months, still verified against last year.'),
      {type:'setting', key:'window', i:1}));
    return {text:text, cards:cards};
  }
  /* --- paid vs organic --- */
  if(/paid|organic|\bads?\b/.test(m)){
    text = t('I can read organic only, which is usually the better proxy for what people actually care about.');
    cards.push(card(t('Organic content only'), t('Excludes paid placements everywhere in this run.'),
      {type:'global', value:'Organic only — exclude paid placements'}));
    return {text:text, cards:cards};
  }
  /* --- tone --- */
  if(/tone|voice|style|sound|register|formal|casual/.test(m)){
    text = t('Tone affects the steps that write words — the ideas, the offers and the post briefs.');
    [['Practitioner voice','Plain and clinical. No hype, no adjectives.'],
     ['Warm and human','Everyday language, first person, close to the reader.'],
     ['Challenger','Direct, a little confrontational, takes a position.']].forEach(([n,d])=>
      cards.push(card(n, d, {type:'multi', items:['insights','props','briefs'].filter(k=>p.plays.includes(k))
        .map(k=>({type:'step', key:k, value:n}))})));
    return {text:text, cards:cards};
  }
  /* --- skip --- */
  if(/skip|drop|remove|leave out|without|don.t need/.test(m)){
    if(step){
      text = t('I can leave that step out. Anything downstream falls back to what is already in the workspace.');
      cards.push(card(t('Skip')+' “'+PLAYS[step].n+'”', esc(TUNE[step].do), {type:'skip', key:step, on:true}));
      return {text:text, cards:cards};
    }
    text = t('Which one should come out?');
    p.plays.slice(0,4).forEach(k=>cards.push(card(t('Skip')+' “'+PLAYS[k].n+'”', esc(TUNE[k].do), {type:'skip', key:k, on:true})));
    return {text:text, cards:cards};
  }
  /* --- volume --- */
  if(/short|fewer|less|smaller|tighter|trim|cut down/.test(m)){
    text = t('I can tighten the output. The evidence is unchanged — there is just less of it in the deliverable.');
    cards.push(card(t('Tighten the whole run'), t('The strongest items only, roughly half the volume.'),
      {type:'global', value:'Tightened — strongest items only'}));
    if(p.plays.includes('calendar')) cards.push(card(t('Shorter calendar'), t('8 weeks instead of 13.'),
      {type:'step', key:'calendar', value:'8 weeks · daily'}));
    return {text:text, cards:cards};
  }
  if(/more|deeper|expand|longer|wider|thorough/.test(m)){
    text = t('I can go wider. It takes longer and, if you add untracked brands, it has to backfill their history first.');
    cards.push(card(t('Expand the whole run'), t('More items, longer window, nothing dropped.'),
      {type:'global', value:'Expanded — more items and a longer window'}));
    return {text:text, cards:cards};
  }
  /* --- a named step, no other signal --- */
  if(step){
    text = `<b>${esc(PLAYS[step].n)}</b> ${t('is currently set to')} “${esc(cfgLabel(step))}”. ${t('Here is what else it can do:')}`;
    TUNE[step].opts.forEach((o,i)=>cards.push(card(o, '', {type:'stepopt', key:step, i:i})));
    return {text:text, cards:cards};
  }
  /* --- fallback: turn whatever they said into a run-wide instruction --- */
  return {text: t('I can apply that as an instruction across the run. It goes to every step, and each one uses it where relevant.'),
    cards:[card('“'+msg.trim()+'”', t('Applied to the whole run as written.'), {type:'global', value:msg.trim()})]};
}

function copSend(preset){
  const box = document.getElementById('copIn');
  const txt = (preset || (box ? box.value : '') || '').trim();
  if(!txt) return;
  COP.msgs.push({who:'you', text:txt});
  const r = copThink(txt);
  COP.msgs.push({who:'bot', text:r.text, cards:r.cards||[], scope:r.scope});
  if(box) box.value='';
  paintCop(true);
}

function copApply(mi, ci){
  const msg = COP.msgs[mi], c = msg.cards[ci];
  const doOne = a => {
    if(a.type==='setting'){ SETVALS[a.key] = {i: a.i!==undefined ? a.i : (SETVALS[a.key]||{}).i||0, free: a.free||''}; }
    else if(a.type==='step'){ cfg(a.key).free = a.value; cfg(a.key).skip = false; }
    else if(a.type==='stepopt'){ const cc=cfg(a.key); cc.i=a.i; cc.free=''; cc.skip=false; }
    else if(a.type==='skip'){ cfg(a.key).skip = a.on; }
    else if(a.type==='global'){ GLOBAL_NOTE = a.value; }
  };
  if(c.apply.type==='multi') c.apply.items.forEach(doOne); else doOne(c.apply);
  c.done = true;
  paintCop(); render();
  toast(t('Applied.') + ' ' + esc(c.label));
}
function copUndoCard(mi, ci){
  const c = COP.msgs[mi].cards[ci];
  if(c.apply.type==='skip') cfg(c.apply.key).skip = !c.apply.on;
  else if(c.apply.type==='global') GLOBAL_NOTE = '';
  c.done = false;
  paintCop(); render(); toast(t('Undone.'));
}
let GLOBAL_NOTE = '';

/* ---------- painting ---------- */
function paintCop(scroll){
  const host = document.getElementById('cop');
  if(!COP.open){ host.innerHTML=''; document.body.classList.remove('copon'); return; }
  document.body.classList.add('copon');
  const p = RUN ? byId(RUN) : null;
  const chips = p ? ['Show me the plan','Only Singapore','Add caregivers as an audience',
                     'Make it faster','Change the tone','Skip the creative step']
                  : ['What can you make?'];
  host.innerHTML = `<aside class="copwin">
    <div class="coph">
      <span class="copav">◆</span>
      <div style="flex:1"><b>${t('SOMIN Copilot')}</b>
        <small>${p?esc(p.name)+' · '+t('can edit this run'):t('ready')}</small></div>
      <button class="x" onclick="copClose()">✕</button>
    </div>
    <div class="copbody" id="copBody">
      ${COP.msgs.map((m,i)=>m.who==='you'
        ? `<div class="cmsg you">${esc(m.text)}</div>`
        : `<div class="cmsg bot">${m.text}
            ${m.scope?scopeSummary():''}
            ${(m.cards||[]).map((c,j)=>`<div class="ccard ${c.done?'done':''}">
              <div class="cch"><b>${esc(c.label)}</b>${c.done?`<span class="cdone">✓ ${t('Applied')}</span>`:''}</div>
              ${c.desc?`<div class="ccd">${esc(c.desc)}</div>`:''}
              ${c.done ? `<button class="cundo" onclick="copUndoCard(${i},${j})">${t('Undo')}</button>`
                       : `<button class="capply" onclick="copApply(${i},${j})">${t('Apply this')}</button>`}
            </div>`).join('')}
          </div>`).join('')}
    </div>
    <div class="copchips">${chips.map(c=>`<button onclick="copSend('${esc(c)}')">${t(c)}</button>`).join('')}</div>
    <div class="copin">
      <textarea id="copIn" rows="1" placeholder="${t('Tell me what to change…')}"
        oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();copSend()}"></textarea>
      <button class="btn sm" onclick="copSend()">${t('Send')}</button>
    </div>
  </aside>`;
  const b = document.getElementById('copBody');
  if(b) b.scrollTop = b.scrollHeight;
  if(scroll){ const i2=document.getElementById('copIn'); if(i2) i2.focus(); }
}

/* =====================================================================
   THE DELIVERABLE — readable in the app, not a black box you download.
   Slide content is drawn from the same numbers as the evidence views, so
   what the deck says and what the audit trail says cannot drift apart.
   ===================================================================== */

 brand:{kind:'deck', name:'ExoStride — US market-entry briefing', slides:[

  {t:'toc', h:'What is in here', list:['The audience — who is actually in this category',
    'The opening — what is moving and what is unclaimed','What to say — three ideas and six offers',
    'When to say it — moments and a 13-week calendar','The creative — rendered and scored','How this was checked']},
  {t:'div', h:'01 — The audience', sub:'Who is actually in this category'},
  {t:'table', h:'Five audiences, and how much of each you own', cols:['Audience','Content about them','Yours'],
   rows:[['Active seniors','152 posts','2'],['Individuals with mobility challenges','104 posts','7'],
         ['Rehabilitation patients','88 posts','11'],['Outdoor enthusiasts','61 posts','0'],['Caregivers','43 posts','0']],

let SLIDE = 0;

function deckFor(id){ return DECKS[id] || DECKS.brand; }

function openDeliverable(id){
  const d = deckFor(id);
  SLIDE = 0;
  if(d.kind==='calendar') return openCalendar(d);
  $('#modal').innerHTML = `<div class="ovl deckovl" onclick="if(event.target===this)closeMod()">
    <div class="deckwin">
      <div class="deckbar">
        <b>${esc(d.name)}</b>
        <span class="tiny" id="slideNo">1 / ${d.slides.length}</span>
        <span style="flex:1"></span>
        <button class="lnkbtn" onclick="toast('${t('Download is outside this prototype')}')">${t('Download PPTX')}</button>
        <button class="x" onclick="closeMod()">✕</button>
      </div>
      <div class="deckbody">
        <div class="rail" id="rail">${d.slides.map((sl,i)=>
          `<button class="thumb ${i===0?'on':''}" onclick="gotoSlide(${i})">
             <span class="tn">${i+1}</span><span class="tt">${esc(stripTags(sl.h)).slice(0,42)}</span></button>`).join('')}</div>
        <div class="stage"><div class="slide" id="slide">${slideHTML(d.slides[0])}</div>
          <div class="deckctl">
            <button class="btn ghost sm" onclick="stepSlide(-1)">← ${t('Back')}</button>
            <button class="btn sm" onclick="stepSlide(1)">${t('Next')} →</button>
          </div>
        </div>
      </div>
    </div></div>`;
  document.onkeydown = e => { if(e.key==='ArrowRight') stepSlide(1); if(e.key==='ArrowLeft') stepSlide(-1); if(e.key==='Escape') closeMod(); };
}
const stripTags = h => String(h).replace(/<[^>]+>/g,'');
function gotoSlide(i){
  const d = deckFor(RUN); SLIDE = Math.max(0, Math.min(d.slides.length-1, i));
  document.getElementById('slide').innerHTML = slideHTML(d.slides[SLIDE]);
  document.getElementById('slideNo').textContent = (SLIDE+1)+' / '+d.slides.length;
  Array.from(document.querySelectorAll('.thumb')).forEach((el,n)=>el.classList.toggle('on', n===SLIDE));
  const on = document.querySelector('.thumb.on'); if(on) on.scrollIntoView({block:'nearest'});
}
function stepSlide(n){ gotoSlide(SLIDE+n); }

function slideHTML(sl){
  const H = `<h2 class="sh">${sl.h}</h2>`;
  switch(sl.t){
    case 'cover': return `<div class="sl cover"><div class="wmk on-light"><span class="so">SO</span><span class="min">MIN</span></div>
      <h1>${sl.h}</h1><p>${esc(sl.sub)}</p></div>`;
    case 'div': return `<div class="sl divider"><div class="eyebrow">${esc(sl.h)}</div><h1>${esc(sl.sub)}</h1></div>`;
    case 'toc': return `<div class="sl">${H}<ol class="toc">${sl.list.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`;
    case 'table': return `<div class="sl">${H}
      <div class="evhead">${sl.cols.map((c,i)=>`<span class="${i===0?'c1':i===1?'c2':'c3'}">${esc(c)}</span>`).join('')}</div>
      ${sl.rows.map(r=>`<div class="evrow"><span class="c1">${r[0]}</span><span class="c2">${r[1]}</span><span class="c3">${r[2]}</span></div>`).join('')}
      ${sl.foot?`<p class="sfoot">${sl.foot}</p>`:''}</div>`;
    case 'cards': return `<div class="sl">${H}<div class="slcards">${sl.cards.map(c=>
      `<div class="slcard"><b>${esc(c.n)}</b><p>${c.d}</p></div>`).join('')}</div></div>`;
    case 'bars': return `<div class="sl">${H}${sl.rows.map(r=>
      `<div class="wsrow"><span class="wl">${r[0]}</span>
        <span class="wt"><i class="eng" style="width:${r[1]*2}%"></i><i class="sup" style="width:${r[2]*2}%"></i></span>
        <span class="wv">${r[1]}% / ${r[2]}%</span><span class="wd ${r[3].toLowerCase()}">${r[3]}</span></div>`).join('')}
      <div class="legend"><span><i class="eng"></i>${t('Share of engagement')}</span><span><i class="sup"></i>${t('Share of content')}</span></div>
      ${sl.foot?`<p class="sfoot">${sl.foot}</p>`:''}</div>`;
    case 'quote': return `<div class="sl quote"><h1>${esc(sl.h)}</h1><p>${esc(sl.sub)}</p></div>`;
    case 'cal': return `<div class="sl">${H}<div class="calgrid">
      ${CAL_WEEKS.map(r=>`<div class="calrow"><span class="cw">${r[0]}</span><span class="cd">${r[1]}</span>
        <span class="cm">${r[2]}</span><span class="cc">${r[3]}</span></div>`).join('')}</div>
      ${sl.foot?`<p class="sfoot">${sl.foot}</p>`:''}</div>`;
    case 'briefs': return `<div class="sl">${H}${CAL_WEEKS.slice(0,4).map(r=>
      `<div class="brief"><div class="bmeta">${r[1]} · ${r[3]} · ${r[4]}</div>
        <div class="bmsg">${r[2]}</div>
        <div class="bcta">${t('Call to action')}: ${t('Book a 20-minute walk test')} → exostride.com/try</div></div>`).join('')}</div>`;
    case 'creative': return `<div class="sl">${H}<div class="crgrid">
      ${[['Kopitiam walk','AWARENESS','0.84'],['Tired knees','AWARENESS','0.82'],['Mobility is a right','CONSIDERATION','0.61'],
         ['The stairs','CONVERSION','0.87'],['Every step counts','CONVERSION','0.80'],['12 weeks','CONSIDERATION','0.74']].map(c=>
        `<div class="cr"><div class="crimg"><span class="crk">${c[1]}</span>${c[2]>='0.80'?`<span class="crtop">✦ ${t('Top')}</span>`:''}
          <span class="crhook">${esc(c[0])}</span></div><div class="crsc">${t('Clickability')} ${c[2]}</div></div>`).join('')}
      </div></div>`;
    case 'sources': return `<div class="sl">${H}<p class="sfoot" style="margin:0 0 14px">${t('Every figure in this deck traces to one of these.')}</p>
      ${Object.keys(EVID).slice(0,8).map(k=>`<div class="evrow"><span class="c1">${t(EVID[k].h)}</span>
        <span class="c3 mono">${esc(EVID[k].src)}</span></div>`).join('')}</div>`;
    default: return `<div class="sl">${H}</div>`;
  }
}

     footer offers Share alongside Start. On Home it is one action only. */
  const foot = (ctx==='store' && p.owned)
    ? `<span>${esc(p.makes)}</span>

/* Changing the dropdown must move the justification with it — a reason that
   contradicts the box above it is worse than no reason at all. */
function setPick(k, i){
  const cur = SETVALS[k] || {i:0, free:''};
  SETVALS[k] = {i:i, free:cur.free||''};
  const opt = SETUP[k].opts[i];
  const why = document.getElementById('why-'+k);
  if(why) why.innerHTML = opt.why;
  const free = document.getElementById('free-'+k);
  const wrap = free ? free.closest('.freewrap') : null;
  if(free && wrap){
    if(opt.ask){ wrap.hidden=false; free.placeholder=opt.ask; free.focus(); freeSend(k); }
    else { wrap.hidden=true; }
  }
}
function setFree(k, v){
  const cur = SETVALS[k] || {i:0, free:''};
  SETVALS[k] = {i:cur.i, free:v};
}
/* Typing here is the start of a conversation, not the end of one. As soon as
   there is text, a Send button appears; pressing it opens the Copilot with
   what you wrote already asked, so you can refine it rather than guess. */
function freeSend(k){
  const b = document.getElementById('send-'+k), f = document.getElementById('free-'+k);
  if(b && f) b.hidden = !f.value.trim();
}
function freeGo(k){
  const f = document.getElementById('free-'+k);
  const txt = f ? f.value.trim() : '';
  if(!txt) return;
  copOpen();
  copSend(t(SETUP[k].k) + ': ' + txt);
}

/* ---------------- build engine ---------------- */
function startBuild(){
  STEP=2; render(); toTop();
  const p = byId(RUN);
  clearTimers();
  p.plays.forEach((k,i)=>{
    TIMERS.push(setTimeout(()=>{
      const el=document.getElementById('pl'+i); if(!el) return;
      el.classList.add('on'); el.querySelector('.m').innerHTML='<span class="spin"></span>';
      TIMERS.push(setTimeout(()=>{
        const e2=document.getElementById('pl'+i); if(!e2) return;
        e2.classList.remove('on'); e2.classList.add('ok');
        e2.querySelector('.m').textContent='✓';
        const o=document.getElementById('out'+i); if(o) o.textContent=PLAYS[k].out;
        const pct=Math.round((i+1)/p.plays.length*100);
        const bp=document.getElementById('bPct'); if(bp) bp.textContent=pct+'%';
        if(i===p.plays.length-1){
          TIMERS.push(setTimeout(()=>{
            RUNS.unshift({id:'r'+Date.now(), pb:p.id, client:'ExoStride', st:'done', pct:100,
              meta:t('Finished just now')+' · '+p.makes+' · '+t('checked')});
            updateCounts(); STEP=3; render(); toTop();
            toast(t('Done')+' — '+p.name.toLowerCase()+' '+t('is ready'));
          }, 700));
        }
      }, 620));
    }, i*900));
  });
}
function cancelBuild(){ clearTimers(); toast(t('Build stopped.')); go('home'); }
function clearTimers(){ TIMERS.forEach(clearTimeout); TIMERS=[]; }

    <div class="mb">
      ${e.edit?`<div class="editbar">
        <span><b>${e.rows.length-off}</b> ${t('of')} ${e.rows.length} ${t('rows will be used')}</span>
        ${off?`<button class="lnkbtn" onclick="resetRows('${k}')">${t('Put them all back')}</button>`:
              `<span class="tiny">${t('Untick anything you do not want this run to read.')}</span>`}
      </div>`:''}
      <div class="evhead">${e.edit?'<span class="cx"></span>':''}${e.cols.map((c,i)=>`<span class="${i===0?'c1':i===1?'c2':'c3'}">${t(c)}</span>`).join('')}</div>
      ${e.rows.map((r,i)=>`<div class="evrow ${excluded(k,i)?'off':''}">
        ${e.edit?`<span class="cx"><button class="tick ${excluded(k,i)?'':'on'}" onclick="toggleRow('${k}',${i})">${excluded(k,i)?'':'✓'}</button></span>`:''}
        <span class="c1">${r[0]}</span><span class="c2">${r[1]}</span><span class="c3">${r[2]}</span></div>`).join('')}
      <div class="note" style="margin-top:18px"><span class="d"></span><span>${t(e.note)}</span></div>
    </div>
    <div class="mf"><button class="btn ghost" onclick="closeMod()">${t('Close')}</button>
      <button class="lnkbtn" onclick="evidenceIndex()">${t('All sources')} →</button>
      <button class="lnkbtn" style="margin-left:auto" onclick="toast('${t('Raw export is outside this prototype')}')">${t('Export the rows')}</button></div>
  </div></div>`;
}

/* The whole audit trail in one place — reachable from a result, from any
   evidence view, and from a finished run in My work. This is the piece that
   replaced the old nine-screen data tree: same data, arrived at from the
   claim rather than browsed before there is a claim. */
function evidenceIndex(){
  const p = RUN ? byId(RUN) : null;
  const keys = p ? Array.from(new Set(['brandkit','audience','rivals','window'].concat(p.plays.map(k=>PLAY_EVID[k]))))
                 : Object.keys(EVID);
  $('#modal').innerHTML = `<div class="ovl" onclick="if(event.target===this)closeMod()"><div class="mod" style="width:min(680px,100%)">
    <div class="mh"><div class="eyebrow" style="margin-bottom:8px">${t('THE AUDIT TRAIL')}</div>
      <h2 style="font-size:20px">${t('Everything this was based on')}</h2>
      <div class="muted" style="font-size:13.5px;margin-top:6px">${t('Open any row to see the rows behind it.')}</div>
      <button class="x" onclick="closeMod()">✕</button></div>
    <div class="mb" style="max-height:52vh;overflow-y:auto">
      ${keys.map(k=>{const e=EVID[k]; return `<button class="srcrow" onclick="evidence('${k}')">
        <span class="d"></span>
        <span style="flex:1"><b>${t(e.h)}</b><small>${esc(e.src)}</small></span>
        <span class="go">${e.rows.length} ${t('rows')} ›</span></button>`;}).join('')}
    </div>
    <div class="mf"><button class="btn ghost" onclick="closeMod()">${t('Close')}</button>
      <button class="lnkbtn" onclick="toast('${t('Full export is outside this prototype')}')">${t('Export the whole trail')}</button></div>
  </div></div>`;
}

/* Clicking a play mid-build only makes sense once it has produced something. */
function peek(rowId, k){
  const el = document.getElementById(rowId);
  if(!el || !el.classList.contains('ok')){ toast(t('That step has not finished yet.')); return; }
  evidence(k);
}

/* ---------------- single play ---------------- */
function runPlay(k){
  const p = PLAYS[k];
  $('#modal').innerHTML = `<div class="ovl" onclick="if(event.target===this)closeMod()"><div class="mod">
    <div class="mh"><div class="eyebrow" style="margin-bottom:8px">${t('ONE PLAY')} · ${esc(p.cmd)}</div>
      <h2 style="font-size:20px">${esc(p.n)}</h2><button class="x" onclick="closeMod()">✕</button></div>
    <div class="mb">
      <p style="font-size:14.5px;line-height:1.65">${t('Runs this step on its own against the same workspace evidence. No full build, no deliverable — just the answer.')}</p>
      <div style="margin-top:18px">
        <div class="kv"><span class="kk">${t('Typical result')}</span><span class="vv">${esc(p.out)}</span></div>
        <div class="kv"><span class="kk">${t('Takes about')}</span><span class="vv">2–4 ${t('min')}</span></div>
        <div class="kv"><span class="kk">${t('Counts against')}</span><span class="vv">${t('Nothing — plays are unlimited')}</span></div>
      </div>
      <span class="lbl">${t('Narrow it down')} <span style="font-weight:500;text-transform:none;letter-spacing:0;color:var(--faint)">— ${t('optional')}</span></span>
      <input class="inp" id="playAsk" autocomplete="off"
        placeholder="${t('e.g. only Singapore, only the last 90 days, ignore paid')}">
      <div class="why" style="margin-top:8px">${t('Leave it blank and this play runs against the whole workspace. Anything you type here narrows it for this run only — plain English is fine.')}</div>
      <button class="lnkbtn" style="margin-top:14px" onclick="evidence('${PLAY_EVID[k]||'audience'}')">${t('See the kind of data it works from')} →</button>
    </div>
    <div class="mf"><button class="btn" onclick="runPlayNow('${esc(p.n)}')">${t('Run it')} →</button>
      <button class="lnkbtn" onclick="closeMod()">${t('Close')}</button></div>
  </div></div>`;
}

function runPlayNow(name){
  const ask = (document.getElementById('playAsk')||{}).value || '';
  closeMod();
  toast(name + ' — ' + t('running') + (ask.trim() ? ' · ' + esc(ask.trim()) : '') + '. ' + t('It will appear in My work.'));
}

function openRun(id){
  const r = RUNS.find(x=>x.id===id); if(!r) return;
  if(r.st==='done'){ RUN=r.pb; STEP=3; VIEW='run'; render(); }
  else { RUN=r.pb; STEP=1; SETVALS={}; VIEW='run'; render(); toast(t('Picking this back up where it paused.')); }
}
</script>
<script>
/* =====================================================================
   MANUAL MODE — the whole platform as a conversation.

   Guided mode walks you down the playbook. Manual mode does not: you ask,
   it works, it shows the trace of what it ran and hands you the artefact.
   Same engine, same evidence, no rails. Modelled on the agent workspace in
   the original build — a live trace of the calls, then the deliverable.
   ===================================================================== */
let MODE = 'guided';
let CHAT = {msgs:[], busy:false, n:0};

function setMode(m){
  MODE = m;
  if(m==='chat' && !CHAT.msgs.length) chatGreet();
  go(m==='chat' ? 'chat' : 'home');
}

function chatGreet(){
  CHAT.msgs.push({who:'ai', html:
    `<p>${t('Ask me for anything this platform can do and I will just do it — no playbook, no forms.')}</p>
     <p style="margin-top:9px">${t('I can see the ExoStride workspace: 612 creators, five tracked brands, a year of history. Try one of these, or write your own.')}</p>`});
}

const CHAT_CHIPS = [
  'Where is our biggest audience gap?',
  'Build me a brand briefing',
  'Which themes are open?',
  'Run whitespace analysis',
  'What should we post next week?',
  'Save the last deck to Google Drive'
];

function vChat(){
  return `<div class="chatpage">
    <div class="chatthread" id="chatThread">
      ${CHAT.msgs.map(m=>m.who==='me'
        ? `<div class="amsg me"><div class="ava me">AF</div><div class="abub">${esc(m.text)}</div></div>`
        : `<div class="amsg ai"><div class="ava">◆</div><div class="abub">${m.html}</div></div>`).join('')}
      ${CHAT.busy?`<div class="amsg ai"><div class="ava">◆</div><div class="abub typing"><i></i><i></i><i></i></div></div>`:''}
    </div>
    <div class="chatdock">
      <div class="chips">${CHAT_CHIPS.map(c=>`<button onclick="chatSend('${esc(c)}')">${t(c)}</button>`).join('')}</div>
      <div class="chatbar">
        <textarea id="chatIn" rows="1" placeholder="${t('Ask for anything — an analysis, a deck, a calendar…')}"
          oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,140)+'px'"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();chatSend()}"></textarea>
        <button class="btn" onclick="chatSend()">${t('Send')} →</button>
      </div>
      <div class="chatfoot">${t('Manual mode — the same engine as the playbooks, without the rails.')}
        <a class="lnkbtn" onclick="setMode('guided')">${t('Back to guided')} →</a></div>
    </div>
  </div>`;
}

function paintChat(scroll){
  if(VIEW!=='chat') return;
  const v = document.getElementById('view'); if(!v) return;
  v.innerHTML = vChat();
  const th = document.getElementById('chatThread');
  if(th) th.scrollTop = th.scrollHeight;
  const sc = document.getElementById('scroll'); if(sc) sc.scrollTop = sc.scrollHeight;
  if(scroll){ const i=document.getElementById('chatIn'); if(i) i.focus(); }
}

const wait = ms => new Promise(r=>setTimeout(r, ms));

/* A live trace of the calls, exactly as the agent workspace showed them. */
async function chatTrace(title, rows){
  const idx = CHAT.msgs.push({who:'ai', html:''}) - 1;
  const paint = () => {
    CHAT.msgs[idx].html = `<div class="trace"><div class="th">⚙ ${esc(title)}<span class="tst">${
      rows.every(r=>r.done) ? ' · <b>'+t('done')+'</b>' : ' · '+t('running…')}</span></div>
      ${rows.map(r=>`<div class="tl ${r.done?'ok':r.active?'on':''}">
        <span class="stt">${r.done?'✓':r.active?'<span class="spin"></span>':'·'}</span>
        <span class="nm">${esc(r[0])}</span>
        <span class="rs">${r.done?esc(r[1]):'…'}</span></div>`).join('')}</div>`;
    paintChat();
  };
  paint();
  for(const r of rows){ r.active = true; paint(); await wait(r[2]||600); r.active=false; r.done=true; paint(); }
}

function statRow(items){
  return `<div class="statrow">${items.map(([n,l])=>`<span class="st1"><b>${n}</b><small>${esc(l)}</small></span>`).join('')}</div>`;
}
function barBlock(title, rows){
  const max = Math.max(...rows.map(r=>r[1]));
  return `<div class="miniblock"><div class="mbh">${esc(title)}</div>
    ${rows.map(r=>`<div class="mbrow"><span class="mbl">${esc(r[0])}</span>
      <span class="mbt"><i style="width:${Math.round(r[1]/max*100)}%;${r[2]?'background:var(--teal-d)':''}"></i></span>
      <b class="mbv">${r[1]}</b></div>`).join('')}</div>`;
}
function artefact(id, title, sub){
  return `<div class="artcard"><div class="artthumb"><i></i><i></i><i></i></div>
    <div style="flex:1"><b>${esc(title)}</b><small>${esc(sub)}</small></div>
    <button class="btn sm" onclick="RUN='${id}';openDeliverable('${id}')">${t('Open it')}</button></div>`;
}
function followUps(arr){
  return `<div class="fups">${arr.map(x=>`<button onclick="chatSend('${esc(x)}')">${esc(x)}</button>`).join('')}</div>`;
}

async function chatSend(preset){
  if(CHAT.busy) return;
  const box = document.getElementById('chatIn');
  const txt = (preset || (box?box.value:'') || '').trim();
  if(!txt) return;
  CHAT.msgs.push({who:'me', text:txt});
  if(box){ box.value=''; box.style.height='auto'; }
  CHAT.busy = true; paintChat();
  await wait(420);
  CHAT.busy = false;
  await chatAnswer(txt);
  paintChat(true);
}

async function chatAnswer(msg){
  const m = msg.toLowerCase();
  const say = html => { CHAT.msgs.push({who:'ai', html:html}); paintChat(); };

  /* ---- build a full deliverable ---- */
  if(/build|make|create|produce|generate/.test(m) && /brief|deck|briefing|pitch|portfolio|calendar/.test(m)){
    const which = /pitch|agency/.test(m) ? 'agency' : /portfolio|creator|influencer/.test(m) ? 'creator'
                : /calendar/.test(m) ? 'calendar' : 'brand';
    const p = byId(which);
    say(`<p>${t('Running the whole chain for a')} <b>${esc(p.name.toLowerCase())}</b> ${t('on the ExoStride workspace. I will use what is already set up — 612 creators, four rivals, 12 verified months.')}</p>`);
    await chatTrace(esc(p.cmd) + ' · ' + t('full chain'),
      p.plays.map(k=>[PLAYS[k].n, PLAYS[k].out, 620]));
    say(`<p><b>${t('Done.')}</b> ${t('It passed its own quality check — one trend claim failed the prior-year test and was downgraded to “steady” rather than dropped silently.')}</p>
      ${artefact(which, 'ExoStride — ' + p.name.toLowerCase(), p.makes + ' · ' + t('quality check passed'))}
      ${followUps(['Show me the evidence behind it','Save it to Google Drive','Make a shorter version'])}`);
    RUNS.unshift({id:'r'+(++CHAT.n)+Date.now(), pb:which, client:'ExoStride', st:'done', pct:100,
      meta: t('Built in manual mode') + ' · ' + p.makes});
    updateCounts();
    return;
  }

  /* ---- audience gap ---- */
  if(/gap|biggest|audience|room|who/.test(m)){
    say(`<p>${t('Your biggest gap is')} <b>${t('Active seniors')}</b>. ${t('There are 152 posts about them in the category — 118 on Wandercraft, 34 on DNSYS — and only 2 of them are yours.')}</p>
      ${barBlock(t('Content about each audience'), [['Active seniors',152],['Mobility challenges',104],['Rehab patients',88],['Outdoor',61],['Caregivers',43],['ExoStride, all rooms',14,true]])}
      <p style="margin-top:11px">${t('Rehab patients is where you are strongest at 11 posts, and it is the third-largest room. Outdoor and caregivers are completely untouched by you.')}</p>
      ${followUps(['Which themes are open?','Build me a brand briefing','Why is this the proxy?'])}`);
    return;
  }

  /* ---- open themes ---- */
  if(/open|whitespace|theme|unclaimed|space/.test(m) && !/run/.test(m)){
    say(`<p>${t('Three themes have far more engagement than content. Everyday dignity is the widest gap in the category.')}</p>
      ${barBlock(t('Engagement vs content share'), [['Everyday dignity 39/8',39],['Getting back to normal 21/12',21],['Design & wearability 20/27',20],['Cost & access 14/9',14],['Raw power 6/44',6,true]])}
      <p style="margin-top:11px">${t('Raw power is where every rival already is — 44% of the content, 6% of the engagement. It is the worst square metre in the market.')}</p>
      ${followUps(['Build me a brand briefing','Run whitespace analysis','Show me the rivals'])}`);
    return;
  }

  /* ---- run a single play ---- */
  if(/^run |run the |just run/.test(m) || (/analysis|scoring|scan/.test(m) && /run/.test(m))){
    const k = /whitespace|open/.test(m) ? 'whitespace' : /trend/.test(m) ? 'trends'
            : /persona|audience/.test(m) ? 'personas' : /scor|click/.test(m) ? 'scoring'
            : /moment|timing/.test(m) ? 'moments' : /creative|render/.test(m) ? 'creative' : 'whitespace';
    say(`<p>${t('Running')} <b>${esc(PLAYS[k].n.toLowerCase())}</b> ${t('on its own — no full build.')}</p>`);
    await chatTrace(esc(PLAYS[k].cmd), [
      ['SOMIN · studies-get', '3 cohort studies', 700],
      ['align themes across cohorts', 'themes matched', 550],
      ['share-of-voice + sample check', 'proportional', 550],
      ['apply the 6-verdict rubric', PLAYS[k].out, 650]]);
    say(`<p>${t('Result')}: <b>${esc(PLAYS[k].out)}</b>.</p>
      ${statRow([['4', t('open')],['1', t('contested')],['1', t('crowded')]])}
      ${followUps(['Show me the evidence behind it','Build me a brand briefing'])}`);
    return;
  }

  /* ---- what to post ---- */
  if(/post|publish|calendar|next week|say/.test(m)){
    say(`<p>${t('Next week falls in the everyday-dignity block, which carries 60% of the plan. Three slots:')}</p>
      <div class="miniblock">
        <div class="mbrow2"><b>Mon</b><span>“Dad walked to the kopitiam by himself today.”</span><small>LinkedIn</small></div>
        <div class="mbrow2"><b>Wed</b><span>“Tired knees should not decide where you go.”</span><small>Instagram</small></div>
        <div class="mbrow2"><b>Fri</b><span>“1 in 3 adults over 65 face mobility limits.”</span><small>LinkedIn</small></div>
      </div>
      <p style="margin-top:11px">${t('Each has a written brief and a call to action behind it.')}</p>
      ${followUps(['Build me a content calendar','Change the tone to something warmer'])}`);
    return;
  }

  /* ---- evidence ---- */
  if(/evidence|source|why|prove|check|trust|behind/.test(m)){
    say(`<p>${t('Everything traces. Here is where the last answer came from:')}</p>
      <div class="miniblock">
        <div class="srcline"><b>${t('Who is in this category')}</b><small class="mono">SOMIN · studies-get · 612 creators · 12 months</small></div>
        <div class="srcline"><b>${t('Themes with more demand than supply')}</b><small class="mono">SOMIN · whitespace cohorts · brand vs 4 rivals</small></div>
        <div class="srcline"><b>${t('How the trend claims are checked')}</b><small class="mono">SOMIN · studies-create ×2 windows · prior-year</small></div>
      </div>
      <p style="margin-top:11px"><button class="lnkbtn" onclick="RUN='brand';evidenceIndex()">${t('Open the full audit trail')} →</button></p>`);
    return;
  }

  /* ---- handoffs ---- */
  if(/save|export|send|drive|slack|figma|share/.test(m)){
    const where = /slack/.test(m) ? 'Slack' : /figma/.test(m) ? 'Figma' : 'Google Drive';
    await chatTrace(t('Handoff'), [[where + ' · upload', t('saved to') + ' /SOMIN/ExoStride/', 800]]);
    say(`<p><b>✓ ${t('Saved to')} ${where}</b> — /SOMIN/ExoStride/</p>${followUps(['Build me a brand briefing','What should we post next week?'])}`);
    return;
  }

  /* ---- shorter / tone ---- */
  if(/short|tone|warmer|change/.test(m)){
    say(`<p>${t('I can rebuild it with that applied. It reruns the steps that write words — the ideas, the offers and the briefs — and leaves the analysis alone.')}</p>
      ${followUps(['Build me a brand briefing','Back to guided mode'])}`);
    return;
  }

  /* ---- back to guided ---- */
  if(/guided|playbook|form|wizard|back to/.test(m)){
    say(`<p>${t('Switching you back to guided mode — same engine, with the steps laid out.')}</p>`);
    setTimeout(()=>setMode('guided'), 700);
    return;
  }

  /* ---- fallback ---- */
  say(`<p>${t('I can answer from the workspace data, run any single play, or build a whole deliverable end to end.')}</p>
    ${followUps(['Where is our biggest audience gap?','Build me a brand briefing','Run whitespace analysis'])}`);
}

/* =====================================================================
   ROUTER
   ===================================================================== */
const TITLES = {home:'Make something', work:'My work', store:'Playbook Store',
                billing:'Plan & billing', settings:'Settings', chat:'Chat'};

function go(v){
  clearTimers(); closeMod();
  if(v!=='chat') MODE='guided';
  const g=document.getElementById('mdG'), c=document.getElementById('mdC');
  if(g&&c){ g.classList.toggle('on', v!=='chat'); c.classList.toggle('on', v==='chat'); }
  VIEW = v; if(v!=='run'){ RUN=null; STEP=1; }
  $$('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  render();
  const sc=$('#scroll'); if(sc) sc.scrollTop=0;
}

function toTop(){ const sc=$('#scroll'); if(sc) sc.scrollTop=0; }

function render(){
  const v=$('#view'); if(!v) return;
  let html='', title=TITLES[VIEW]||'';
  if(VIEW==='run'){
    const p=byId(RUN);
    title = p ? p.name : '';
    html = STEP===1 ? vSetup() : STEP===2 ? vBuild() : vDone();
    $$('#nav button').forEach(b=>b.classList.remove('on'));
  } else if(VIEW==='chat')     { html=vChat(); $$('#nav button').forEach(b=>b.classList.remove('on')); }
  else if(VIEW==='work')     { html=vWork(); }
  else if(VIEW==='store')      { html=vStore(); }
  else if(VIEW==='billing')    { html=vBilling(); }
  else if(VIEW==='settings')   { html=vSettings(); }
  else                         { html=vHome(); }
  v.className = 'wrap' + (VIEW==='chat' ? ' chatwrap' : '');
  document.body.classList.toggle('chatmode', VIEW==='chat');
  v.innerHTML = html;
  if(VIEW==='chat'){ const th=document.getElementById('chatThread'); if(th) th.scrollTop=th.scrollHeight; }
  const pt=$('#ptitle'); if(pt){ pt.textContent = t(title); pt.dataset.en = title; }
}

function updateCounts(){
  const w=$('#navWork'); if(w) w.textContent = RUNS.length;
  const s=$('#navStore');
  const n = PLAYBOOKS.filter(p=>!p.owned && p.shared).length;
  if(s){ s.textContent = n; s.style.display = n ? '' : 'none'; }
}

function toast(msg){
  const el=document.createElement('div');
  el.className='toast'; el.innerHTML='<span class="d"></span><span>'+msg+'</span>';
  $('#toasts').appendChild(el);
  setTimeout(()=>{ el.style.transition='.25s'; el.style.opacity='0'; el.style.transform='translateY(6px)';
    setTimeout(()=>el.remove(), 260); }, 3400);
}

/* boot */
setLang(LANG);
updateCounts();
render();
</script>

<style>

.copwin{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:#fff;z-index:180;
  border-left:1px solid var(--hair);box-shadow:-16px 0 50px rgba(22,32,31,.13);
  display:flex;flex-direction:column;animation:slidein .26s cubic-bezier(.2,.7,.2,1)}

<style>
/* ---------- mode switch ---------- */
